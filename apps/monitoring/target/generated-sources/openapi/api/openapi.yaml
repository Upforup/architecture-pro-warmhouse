openapi: 3.0.3
info:
  contact:
    name: Smart Home API
  description: |
    REST API for managing smart home sensors in a home automation system.

    This API provides endpoints for creating, reading, updating, and deleting sensors.
    Temperature sensors automatically fetch real-time data from an external temperature service.

    ## Sensor Types
    - `temperature` - Temperature sensors that fetch live data from external API

    ## Status Values
    - `active` - Sensor is currently active and reporting data
    - `inactive` - Sensor is inactive
  license:
    name: MIT
  title: Smart Home Sensor API
  version: 1.0.0
servers:
- description: Local development server
  url: http://localhost:8080
- description: Temperature service (internal)
  url: http://temperature-api:8081
tags:
- description: Health check endpoints
  name: health
- description: Sensor management operations
  name: sensors
paths:
  /health:
    get:
      description: Check if the API is running
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_health_get_200_response"
          description: API is healthy
      summary: Health check
      tags:
      - health
      x-accepts:
      - application/json
  /api/v1/sensors:
    get:
      description: |
        Retrieve all sensors from the database.

        For temperature sensors, the response includes real-time data fetched from the external temperature API.
      responses:
        "200":
          content:
            application/json:
              example:
              - id: 1
                name: Living Room Temperature
                type: temperature
                location: living_room
                value: 22.5
                unit: °C
                status: active
                last_updated: 2025-02-15T10:30:00Z
                created_at: 2025-02-15T08:00:00Z
              - id: 2
                name: Bedroom Temperature
                type: temperature
                location: bedroom
                value: 20.1
                unit: °C
                status: active
                last_updated: 2025-02-15T10:30:00Z
                created_at: 2025-02-15T08:00:00Z
              schema:
                items:
                  $ref: "#/components/schemas/Sensor"
                type: array
          description: List of all sensors
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Internal server error
      summary: Get all sensors
      tags:
      - sensors
      x-accepts:
      - application/json
    post:
      description: Create a new sensor with the provided details
      requestBody:
        content:
          application/json:
            example:
              name: Kitchen Temperature
              type: temperature
              location: kitchen
              unit: °C
            schema:
              $ref: "#/components/schemas/SensorCreate"
        required: true
      responses:
        "201":
          content:
            application/json:
              example:
                id: 3
                name: Kitchen Temperature
                type: temperature
                location: kitchen
                value: 0
                unit: °C
                status: inactive
                last_updated: 2025-02-15T10:35:00Z
                created_at: 2025-02-15T10:35:00Z
              schema:
                $ref: "#/components/schemas/Sensor"
          description: Sensor created successfully
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Invalid request body
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Internal server error
      summary: Create a new sensor
      tags:
      - sensors
      x-content-type: application/json
      x-accepts:
      - application/json
  /api/v1/sensors/{id}:
    delete:
      description: Delete a sensor by its ID
      parameters:
      - description: Numeric ID of the sensor
        explode: false
        in: path
        name: id
        required: true
        schema:
          minimum: 1
          type: integer
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_api_v1_sensors__id__delete_200_response"
          description: Sensor deleted successfully
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Invalid sensor ID format
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Internal server error
      summary: Delete a sensor
      tags:
      - sensors
      x-accepts:
      - application/json
    get:
      description: |
        Retrieve a specific sensor by its ID.

        For temperature sensors, the response includes real-time data fetched from the external temperature API.
      parameters:
      - description: Numeric ID of the sensor
        explode: false
        in: path
        name: id
        required: true
        schema:
          minimum: 1
          type: integer
        style: simple
      responses:
        "200":
          content:
            application/json:
              example:
                id: 1
                name: Living Room Temperature
                type: temperature
                location: living_room
                value: 22.5
                unit: °C
                status: active
                last_updated: 2025-02-15T10:30:00Z
                created_at: 2025-02-15T08:00:00Z
              schema:
                $ref: "#/components/schemas/Sensor"
          description: Sensor found
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Invalid sensor ID format
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Sensor not found
      summary: Get sensor by ID
      tags:
      - sensors
      x-accepts:
      - application/json
    put:
      description: Update all fields of an existing sensor
      parameters:
      - description: Numeric ID of the sensor
        explode: false
        in: path
        name: id
        required: true
        schema:
          minimum: 1
          type: integer
        style: simple
      requestBody:
        content:
          application/json:
            example:
              name: Living Room Temperature Updated
              type: temperature
              location: living_room
              unit: °C
              status: active
            schema:
              $ref: "#/components/schemas/SensorUpdate"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sensor"
          description: Sensor updated successfully
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Invalid request body or sensor ID
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Internal server error
      summary: Update a sensor
      tags:
      - sensors
      x-content-type: application/json
      x-accepts:
      - application/json
  /api/v1/sensors/{id}/value:
    patch:
      description: Update the value and status of a sensor
      parameters:
      - description: Numeric ID of the sensor
        explode: false
        in: path
        name: id
        required: true
        schema:
          minimum: 1
          type: integer
        style: simple
      requestBody:
        content:
          application/json:
            example:
              value: 23.5
              status: active
            schema:
              $ref: "#/components/schemas/UpdateSensorValue"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_api_v1_sensors__id__value_patch_200_response"
          description: Sensor value updated successfully
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Invalid request body or sensor ID
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Internal server error
      summary: Update sensor value
      tags:
      - sensors
      x-content-type: application/json
      x-accepts:
      - application/json
  /api/v1/sensors/temperature/{location}:
    get:
      description: |
        Fetch temperature data for a specific location from the external temperature API.

        This endpoint queries the external temperature service directly and returns
        real-time temperature information including description.
      parameters:
      - description: Location to get temperature for
        explode: false
        in: path
        name: location
        required: true
        schema:
          example: living_room
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              example:
                location: living_room
                value: 22.5
                unit: °C
                status: active
                timestamp: 2025-02-15T10:30:00Z
                description: Temperature in living room is comfortable
              schema:
                $ref: "#/components/schemas/TemperatureResponse"
          description: Temperature data retrieved successfully
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Location parameter is missing
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Failed to fetch temperature data
      summary: Get temperature by location
      tags:
      - sensors
      x-accepts:
      - application/json
components:
  schemas:
    Sensor:
      description: Represents a smart home sensor
      example:
        unit: °C
        last_updated: 2025-02-15T10:30:00Z
        name: Living Room Temperature
        created_at: 2025-02-15T08:00:00Z
        location: living_room
        id: 1
        type: temperature
        value: 22.5
        status: active
      properties:
        id:
          description: Unique identifier for the sensor
          example: 1
          type: integer
        name:
          description: Name of the sensor
          example: Living Room Temperature
          type: string
        type:
          description: Type of the sensor
          enum:
          - temperature
          example: temperature
          type: string
        location:
          description: Physical location of the sensor
          example: living_room
          type: string
        value:
          description: Current sensor reading value
          example: 22.5
          format: float64
          type: number
        unit:
          description: Unit of measurement for the sensor value
          example: °C
          type: string
        status:
          description: Current status of the sensor
          enum:
          - active
          - inactive
          example: active
          type: string
        last_updated:
          description: Timestamp of the last sensor update
          example: 2025-02-15T10:30:00Z
          format: date-time
          type: string
        created_at:
          description: Timestamp when the sensor was created
          example: 2025-02-15T08:00:00Z
          format: date-time
          type: string
      required:
      - created_at
      - id
      - last_updated
      - location
      - name
      - status
      - type
      - unit
      - value
      type: object
    SensorCreate:
      description: Data required to create a new sensor
      example:
        unit: °C
        name: Kitchen Temperature
        location: kitchen
        type: temperature
      properties:
        name:
          description: Name of the sensor
          example: Kitchen Temperature
          type: string
        type:
          description: Type of the sensor
          enum:
          - temperature
          example: temperature
          type: string
        location:
          description: Physical location of the sensor
          example: kitchen
          type: string
        unit:
          description: Unit of measurement for the sensor value
          example: °C
          type: string
      required:
      - location
      - name
      - type
      type: object
    SensorUpdate:
      description: Data that can be updated for a sensor
      example:
        unit: °C
        name: Living Room Temperature Updated
        location: living_room
        type: temperature
        value: 23.5
        status: active
      properties:
        name:
          description: Name of the sensor
          example: Living Room Temperature Updated
          type: string
        type:
          description: Type of the sensor
          enum:
          - temperature
          example: temperature
          type: string
        location:
          description: Physical location of the sensor
          example: living_room
          type: string
        value:
          description: Current sensor reading value (can be set to null)
          example: 23.5
          format: float64
          nullable: true
          type: number
        unit:
          description: Unit of measurement for the sensor value
          example: °C
          type: string
        status:
          description: Current status of the sensor
          enum:
          - active
          - inactive
          example: active
          type: string
      type: object
    UpdateSensorValue:
      description: Request body for updating sensor value and status
      example:
        value: 23.5
        status: active
      properties:
        value:
          description: New sensor reading value
          example: 23.5
          format: float64
          type: number
        status:
          description: New status of the sensor
          enum:
          - active
          - inactive
          example: active
          type: string
      required:
      - status
      - value
      type: object
    TemperatureResponse:
      description: Temperature data from external API
      example:
        unit: °C
        description: Temperature in living room is comfortable
        location: living_room
        value: 22.5
        status: active
        timestamp: 2025-02-15T10:30:00Z
      properties:
        location:
          description: Location name
          example: living_room
          type: string
        value:
          description: Temperature value
          example: 22.5
          format: float64
          type: number
        unit:
          description: Temperature unit
          example: °C
          type: string
        status:
          description: Sensor status
          enum:
          - active
          - inactive
          example: active
          type: string
        timestamp:
          description: When the temperature was recorded
          example: 2025-02-15T10:30:00Z
          format: date-time
          type: string
        description:
          description: Human-readable description
          example: Temperature in living room is comfortable
          type: string
      required:
      - location
      - status
      - timestamp
      - unit
      - value
      type: object
    ErrorResponse:
      description: Error response format
      example:
        error: Invalid sensor ID
      properties:
        error:
          description: Error message describing what went wrong
          example: Invalid sensor ID
          type: string
      required:
      - error
      type: object
    _health_get_200_response:
      example:
        status: ok
      properties:
        status:
          example: ok
          type: string
      type: object
    _api_v1_sensors__id__delete_200_response:
      example:
        message: Sensor deleted successfully
      properties:
        message:
          example: Sensor deleted successfully
          type: string
      type: object
    _api_v1_sensors__id__value_patch_200_response:
      example:
        message: Sensor value updated successfully
      properties:
        message:
          example: Sensor value updated successfully
          type: string
      type: object

