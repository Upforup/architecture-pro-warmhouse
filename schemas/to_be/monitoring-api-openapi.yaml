openapi: 3.0.3
info:
  title: Warmhouse Monitoring API
  description: |
    API for querying device telemetry, device status, and aggregated metrics
    from the Warmhouse smart home monitoring system.
  version: 1.0.0
  contact:
    name: Warmhouse API Support
    email: support@warmhouse.com

servers:
  - url: http://localhost:8082/api/v1
    description: Local development server
  - url: https://api.warmhouse.com/monitoring/api/v1
    description: Production server

tags:
  - name: Telemetry
    description: Device telemetry data operations
  - name: Devices
    description: Device status and metadata operations
  - name: Metrics
    description: Aggregated metrics and analytics operations

paths:
  /telemetry:
    get:
      tags:
        - Telemetry
      summary: Query telemetry data
      description: Retrieve telemetry data for devices with optional time range filtering
      operationId: getTelemetry
      parameters:
        - name: deviceId
          in: query
          description: Filter by specific device ID
          required: false
          schema:
            type: string
        - name: from
          in: query
          description: Start of time range (ISO 8601 format)
          required: false
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: End of time range (ISO 8601 format)
          required: false
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Successful response with telemetry data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TelemetryDTO'
        '400':
          description: Invalid request parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error

  /telemetry/{deviceId}/latest:
    get:
      tags:
        - Telemetry
      summary: Get latest telemetry reading
      description: Retrieve the most recent telemetry reading for a specific device
      operationId: getLatestTelemetry
      parameters:
        - name: deviceId
          in: path
          description: Device ID
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful response with latest telemetry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelemetryDTO'
        '404':
          description: Device not found or no telemetry data available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /devices/{deviceId}/status:
    get:
      tags:
        - Devices
      summary: Get device status
      description: Retrieve the current status and metadata of a specific device
      operationId: getDeviceStatus
      parameters:
        - name: deviceId
          in: path
          description: Device ID
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful response with device status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceStatusDTO'
        '404':
          description: Device not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /metrics/{deviceId}:
    get:
      tags:
        - Metrics
      summary: Get aggregated metrics
      description: Retrieve aggregated metrics for a specific device
      operationId: getAggregatedMetrics
      parameters:
        - name: deviceId
          in: path
          description: Device ID
          required: true
          schema:
            type: string
        - name: aggregation
          in: query
          description: Aggregation type
          required: false
          schema:
            type: string
            enum: [hourly, daily, weekly, monthly]
            default: daily
      responses:
        '200':
          description: Successful response with aggregated metrics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricsDTO'
        '404':
          description: Device not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    TelemetryDTO:
      type: object
      properties:
        deviceId:
          type: string
          description: Device that generated the telemetry
        value:
          type: number
          format: double
          description: Telemetry value
        unit:
          type: string
          description: Unit of measurement
          example: "°C"
        timestamp:
          type: string
          format: date-time
          description: When the reading was recorded
      required:
        - deviceId
        - value
        - unit
        - timestamp

    DeviceStatusDTO:
      type: object
      properties:
        deviceId:
          type: string
        status:
          type: string
          enum: [ONLINE, OFFLINE, MAINTENANCE, ERROR]
          description: Current device status
        lastSeen:
          type: string
          format: date-time
          description: Last activity timestamp
      required:
        - deviceId
        - status
        - lastSeen

    MetricsDTO:
      type: object
      properties:
        deviceId:
          type: string
        average:
          type: number
          format: double
          description: Average value
        min:
          type: number
          format: double
          description: Minimum value
        max:
          type: number
          format: double
          description: Maximum value
        count:
          type: integer
          description: Number of data points aggregated
      required:
        - deviceId
        - average
        - min
        - max
        - count

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: Error message
        code:
          type: string
          description: Error code
        timestamp:
          type: string
          format: date-time
      required:
        - error
        - code
        - timestamp

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

security:
  - BearerAuth: []
